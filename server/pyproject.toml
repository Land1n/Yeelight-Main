[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "protocol",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["server"]
