[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manager"
version = "0.1.0"
description = "Десктоп-менеджер ламп Yeelight с синхронизацией с сервером"
requires-python = ">=3.10"
dependencies = [
    "lamp",
    "protocol",
    "flet>=0.86",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["manager"]
