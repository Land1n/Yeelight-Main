[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-server"
version = "0.2.0"
description = "Authenticated Yeelight relay with SQLite storage, typed commands and a web interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "yeelight-logic==0.2.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
yeelight-server = "yeelight_server.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["yeelight_server", "yeelight_server.api", "yeelight_server.security", "yeelight_server.services", "yeelight_server.storage"]

[tool.setuptools.package-data]
yeelight_server = [
    "frontend/templates/*.html",
    "frontend/static/css/*.css",
    "frontend/static/js/*.js",
]
