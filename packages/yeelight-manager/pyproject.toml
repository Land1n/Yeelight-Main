[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-manager"
version = "0.2.0"
description = "Local Yeelight agent: lamp control, Wi-Fi provisioning, desktop UI and server relay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yeelight-logic==0.2.0",
    "websockets>=15,<19",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "flet>=0.80,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = []

[project.scripts]
yeelight-manager = "yeelight_manager.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["yeelight_manager", "yeelight_manager.ui"]
